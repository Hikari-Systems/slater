name: ci

# Fast feedback on every push and pull request: formatting and clippy must be
# clean, the whole workspace must compile, and the fast test suite must pass.
# `release.yml` re-runs the same `cargo test --workspace` as its publish gate and
# adds the tag-only heavy work (fuzzing, multi-arch images, release binaries);
# this workflow is the per-commit signal behind the README's build badge.
on:
  push:
  pull_request:

# A newer push to the same ref supersedes an in-flight run — don't waste runners
# finishing checks on a commit that's already been replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job here only checks out and builds — none write back to the repo or touch
# other GITHUB_TOKEN-scoped APIs. Pin the token to read-only (mirrors release.yml)
# so a compromised step can't push, open PRs, or alter releases.
permissions:
  contents: read

jobs:
  # ── Formatting: mirror the local pre-commit hook (.githooks/pre-commit) ─────
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Formatting
        run: cargo fmt --all --check

      # The Dockerfiles' dependency-cache stub lists must name a source for every
      # declared [[bench]]/[[test]]/[[bin]]/[[example]], and the two lists must agree.
      # Nothing else on a branch checks that: `docker build` runs only from release.yml
      # on a vX.Y.Z tag, so drift stays invisible until release day — after `test` and
      # `fuzz` have burned an hour — and no image is published for that tag. Same
      # reasoning as release.yml's "version tag matches README + Cargo.toml" grep, and
      # the same rule as this file's builder-test filter below: a deliberate act is one
      # someone can forget. Lives in the fmt job because it needs no toolchain or build.
      - name: Dockerfile dep-cache stub lists cover every declared target
        run: python3 .github/scripts/check_dockerfile_stubs.py

  # ── Clippy: mirror the local pre-commit hook (.githooks/pre-commit) ────────
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # `bench-codec` is gated behind a `required-features` cargo feature, so the
      # default `--all-targets` above skips it. Lint it explicitly (with `s3` so its
      # backend leg is covered too) to keep the gated tuning binary from bitrotting.
      - name: Clippy (bench-codec)
        run: cargo clippy -p slater-build --all-targets --features bench-codec,s3 -- -D warnings

      # `testkit` gates slater's benches and several integration tests behind a
      # `required-features` flag, so the `--all-targets` lint above never compiles
      # them — they can rot silently, the same shape as the s3/gcs hole (HIK-138
      # audit). Lint them explicitly.
      - name: Clippy (slater testkit targets)
        run: cargo clippy -p slater --all-targets --features testkit -- -D warnings

  # ── Build: the whole workspace must compile against the committed lockfile ──
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # rustls' aws-lc-rs backend needs a C toolchain + libclang to build (see
      # the Dockerfile builder stage and release.yml).
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build the workspace
        run: cargo build --workspace --locked

  # ── Test: the fast suite, per-commit ───────────────────────────────────────
  # `cargo test --workspace` — the exact command `release.yml` runs as its publish
  # gate. The heavy tests (large-graph builds, live S3/GCS, the real slater-build
  # binary) are `#[ignore]`d or env-gated, so only the ~1450 fast unit/integration
  # tests run here. This suite used to run *only* on a tag, so a change that
  # compiled and linted clean but broke a unit test could merge green and surface
  # only at release; running it on every commit closes that gap.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # rustls' aws-lc-rs backend needs a C toolchain + libclang to build (see the
      # build job and the Dockerfile builder stage).
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Test suite
        run: cargo test --workspace --locked

  # ── Consolidation end-to-end: the `#[ignore]`d tests that spawn the real
  #    `slater-build` binary. They are ignored because `cargo test -p slater` does
  #    not build the builder — not because they are slow or flaky — so nothing ran
  #    them anywhere.
  #
  #    This matters most for the *encrypted* arm. HIK-145 was invisible for its
  #    whole life because every carry test passed `cipher: None`; the tests that
  #    finally cover `Some(..)` end to end are two of the ones in this module, and
  #    leaving them unrun would have left the same "two configurations with no test
  #    in common" gap that caused the bug.
  #
  #    Why a `server::tests::` filter rather than a bare `--ignored` (HIK-220): the
  #    lib target's ignored set is 16, not 14. The two extras are
  #    `cache::tests::{result,vector}_cache_concurrent_*`, ignored as *flaky* — they
  #    assert wall-clock throughput at 1 vs 4 threads, which is meaningless on a
  #    loaded runner (a sibling once passed at 2.4x and failed below 1.2x in the
  #    same run; see the comment at their definition). A blanket `--ignored` would
  #    pull those in and go intermittently red on a timing assertion — worse than
  #    not running them, because it trains people to re-run the job.
  #
  #    Filtering by module rather than by a hand-written list of 14 names means a
  #    renamed builder test still runs, and a newly added one is picked up without
  #    anyone remembering to edit this file. This replaces the previous "named
  #    explicitly so adding one is a deliberate act" rule: a deliberate act is one
  #    someone can forget, and HIK-145 is the precedent for what an unrun test costs.
  #    The module filter is deliberately the *allowlist* form — `--skip
  #    cache::tests::` is equivalent today but is a denylist, so a future flaky perf
  #    test in any other module would silently join this job.
  #
  #    The `SLATER_SMOKE_DATADIR` benchmark in this same source file is NOT in this
  #    ignored set: it is `#[cfg(feature = "perf-mem")]` and this job passes no
  #    `--features`, so it is never compiled. It was previously believed to be the
  #    reason a blanket `--ignored` was impossible here. It was not.
  consolidation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build the builder the tests spawn
        run: cargo build -p slater-build --locked

      - name: Consolidation suite (real slater-build)
        env:
          # ABSOLUTE. `cargo test` runs a test binary with its CWD set to the *package*
          # root (`crates/slater/`), not the workspace root — so a relative
          # `target/debug/slater-build` resolves to `crates/slater/target/…`, which never
          # exists, and every test in the suite fails to spawn the builder. This job was
          # authored on a release branch and first executed on `main`, where that is
          # exactly what happened.
          SLATER_BUILD_BIN: ${{ github.workspace }}/target/debug/slater-build
        run: |
          set -euo pipefail
          # `|| true` is load-bearing: under `set -e` a failing command inside an
          # `out="$(…)"` assignment aborts the script *before* the diagnostic below
          # ever runs, so a genuine test failure surfaced as a bare "exit code 101"
          # with none of cargo's output. Capture, always print, then judge.
          out="$(cargo test -p slater --locked --lib -- \
                   --ignored server::tests:: --test-threads 1 2>&1)" || true
          echo "$out"
          # One assertion covers both failure modes: a run that failed (the result
          # line is not `ok.`), and a filter that matched nothing (`0 passed`, the
          # job otherwise passing having run no tests at all). Deliberately does not
          # assert an exact count — hard-coding 14 here would reintroduce the drift
          # that listing every test by name caused in the first place.
          echo "$out" | grep -qE 'test result: ok\. [1-9][0-9]* passed' \
            || { echo "::error::the server::tests:: --ignored suite failed, or matched no tests"; exit 1; }

  # ── Store backends: compile + run the feature-gated s3/gcs code that the
  #    default build never touches (HIK-138). Whole modules under
  #    `graph-format/src/store/{s3,gcs}.rs` and every `tests/{s3_minio,gcs_*}.rs`
  #    file are `#[cfg(feature = …)]`, so a plain `cargo test` / `cargo clippy`
  #    neither builds nor lints them — which is how two disk-cache bugs *and* a
  #    non-compiling gcs test shipped unnoticed. The integration tests self-skip
  #    without a live MinIO/GCS endpoint (they gate on the SLATER_{S3,GCS}_TEST_*
  #    env vars), so this job needs no cloud credentials: its purpose is to keep
  #    the gated source and test modules building and lint-clean on every commit.
  #    Each backend is exercised alone and together, so a feature that only
  #    compiles alongside the other is still caught.
  store-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        features: [s3, gcs, "s3,gcs"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # rustls' aws-lc-rs backend (pulled by the s3 SDK) needs a C toolchain +
      # libclang, same as the build job and the Dockerfile builder stage.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Clippy (graph-format, ${{ matrix.features }})
        run: cargo clippy -p graph-format --all-targets --features ${{ matrix.features }} --locked -- -D warnings

      # Compiles the gated lib unit tests and the tests/{s3_minio,gcs_*}.rs
      # integration files — a non-compiling gated test is now a red build — and
      # runs everything that doesn't need a live endpoint; the cloud tests self-skip.
      - name: Test (graph-format, ${{ matrix.features }})
        run: cargo test -p graph-format --features ${{ matrix.features }} --locked
